spring:
  application:
    name: ads-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/ads_service_db
    username: dev
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true

  logging:
    level:
      root: INFO

  liquibase:
    change-log: classpath:db/changelog-master.yml