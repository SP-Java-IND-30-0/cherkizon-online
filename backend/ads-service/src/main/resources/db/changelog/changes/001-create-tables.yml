databaseChangeLog:
  - changeSet:
      id: 001
      author: belousov_eu
      changes:
        - createTable:
            tableName: ads
            schemaName: app
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: image_url
                  type: VARCHAR(256)
                  constraints:
                    nullable: false
              - column:
                  name: original_image_filename
                  type: VARCHAR(256)
                  constraints:
                    nullable: false
              - column:
                  name: image_size
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: image_type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

  - changeSet:
      id: 002
      author: belousov_eu
      changes:
        - createIndex:
            indexName: idx_ads_user_id
            tableName: ads
            schemaName: app
            columns:
              - column:
                  name: user_id
