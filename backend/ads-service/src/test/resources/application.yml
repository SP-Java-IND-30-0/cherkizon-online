spring:
  application:
    name: profile-service

  datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    url: jdbc:tc:postgresql:17-alpine:///db_test
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show_sql: true
  sql:
    init:
     mode: always
     platform: postgresq
     encoding: UTF-8
     schema-locations: classpath:init_schema.sql



  liquibase:
    enabled: false