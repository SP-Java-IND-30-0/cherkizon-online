spring:
  application:
    name: ads-service

  datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    url: jdbc:tc:postgresql:17-alpine:///db_test
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show_sql: true
  sql:
    init:
      mode: always
      platform: postgresql
      encoding: UTF-8
      schema-locations: classpath:init_schema.sql
  liquibase:
    enabled: false
  kafka:
#    enabled: false
    bootstrap-servers: localhost:29092
    consumer:
      group-id: ads-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
#  autoconfigure:
#    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
s3:
  access-key: ${YANDEX_ACCESS_KEY}
  secret-key: ${YANDEX_SECRET_KEY}
  uri: https://storage.yandexcloud.net
  region: ru-central1
  bucket-name: cherkizon-test