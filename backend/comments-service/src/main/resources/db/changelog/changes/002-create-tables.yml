databaseChangeLog:
  - changeSet:
      id: 002
      author: k.pravdina
      changes:
        - createTable:
            tableName: comments
            schemaName: app
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: ad_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: text
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 003
      author: k.pravdina
      changes:
        - createIndex:
            indexName: idx_comments_id
            tableName: comments
            schemaName: app
            columns:
              - column:
                  name: id