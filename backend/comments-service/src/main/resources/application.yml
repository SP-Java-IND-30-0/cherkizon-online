spring:
  application:
    name: comments-service

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 5000
            logger-level: basic
          profile-service:
            url: http://localhost:8082
          ads-service:
            url: http://localhost:8083

  kafka:
    bootstrap-servers: localhost:29092
    admin:
      auto-create: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      retries: 3
      acks: all
    consumer:
      group-id: comments-service-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"


  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/comments_service_db
    username: dev
    password: ${DB_PASSWORD}

  sql:
    init:
      mode: always
      platform: postgresql
      encoding: UTF-8
      schema-locations: classpath:db/changelog/changes/001-init-schema-comments-service.sql
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
  liquibase:
    change-log: classpath:db/changelog/changelog-master.yml
    enabled: true
    default-schema: app
    liquibase-schema: service

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

jwt:
  secret-key: ${JWT_SECRET_KEY}

server:
  port: 8084

logging:
  level:
    root: INFO