spring:
  application:
    name: comments-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/comments_service_db
    username: dev
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true

  liquibase:
    change-log: classpath:db/changelog/changelog.yml
    enabled: true

  cloud:
    openfeign:
      client:
        config:
          default:
            loggerLevel: FULL
            connectTimeout: 5000
            readTimeout: 5000

custom:
  profile-service-url: http://localhost:8082

logging:
  level:
    root: INFO