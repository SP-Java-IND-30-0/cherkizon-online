server:
  port: 8080
  servlet:
    context-path: /auth

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:authdb}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.cherkizon: DEBUG