spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_service_db
    username: dev
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:/db/changelog-master.xml
    jwt:
      secret: ${JWT_SECRET}
      access-expiration: 86400000 # 24 часа
      refresh-expiration: 604800000 # 7 дней

logging:
  level:
    root: INFO
