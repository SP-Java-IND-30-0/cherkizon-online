databaseChangeLog:
  - changeSet:
      id: 1
      author: belousov
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(254)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(10)
                  constraints:
                    nullable: false
            indexes:
              - index:
                  name: idx_users_username
                  columns:
                    - column:
                        name: username
                        unique: true

        - createTable:
            tableName: tokens
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: refresh_token
                  type: varchar(500)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_tokens_user_id
                    references: users(id)
              - column:
                  name: expires_at
                  type: timestamp
                  constraints:
                    nullable: false
            indexes:
              - index:
                  name: idx_tokens_refresh_token
                  columns:
                    - column:
                        name: refresh_token
                        unique: true
              - index:
                  name: idx_tokens_user_id
                  columns:
                    - column:
                        name: user_id