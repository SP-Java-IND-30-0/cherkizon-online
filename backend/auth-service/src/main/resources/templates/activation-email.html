<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение регистрации</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .email-container {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1, h2, h3 {
            color: #333333;
            font-weight: normal;
        }
        p {
            font-size: 16px;
            color: #555555;
        }
        .activation-code {
            background-color: #f1f1f1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            color: #333333;
        }
        .footer {
            font-size: 14px;
            color: #777777;
            text-align: center;
            margin-top: 20px;
        }
        .footer a {
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="email-container">
    <h2>Добро пожаловать!</h2>
    <p>Для завершения регистрации на нашем сайте введите следующий код подтверждения:</p>
    <h3 class="activation-code" th:text="${activationCode}">123456</h3>
    <p>Если вы не регистрировались, проигнорируйте это письмо.</p>
    <div class="footer">
        <p>С уважением, команда <strong>Черкизон-онлайн</strong></p>
        <p><a href="#">Отписаться от рассылки</a></p>
    </div>
</div>
</body>
</html>
