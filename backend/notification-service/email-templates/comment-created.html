<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>%s</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            color: #2c3e50;
            text-align: center;
        }

        .comment-card {
            background-color: #f0f7ff;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #2980b9;
        }

        .user-badge {
            display: inline-block;
            background-color: #e1f0fa;
            padding: 3px 8px;
            border-radius: 15px;
            font-size: 14px;
            margin-right: 10px;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            text-align: center;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="header">Кто-то оставил вам комментарий! 💬</h1>
    <p>Привет, %s!</p>
    <p>Пользователь <span class="user-badge">%s</span> только что оставил комментарий к вашему объявлению
        <strong>"%s"</strong>:</p>

    <div class="comment-card">
        <p><a href="%s">Читать полностью и ответить →</a></p>
    </div>

    <p>Не оставляйте его без внимания — возможно, это начало интересного диалога!</p>
    <p>С наилучшими пожеланиями,<br>Команда %s</p>
    <div class="footer">
        <p><a href="%s">Написать в поддержку</a></p>
    </div>
</div>
</body>
</html>
