spring:
  mail:
    host: mock.smtp
    port: 2525
    username: test@test.com
    password: test
    properties:
      mail.smtp:
        auth: false


  security:
    user:
      name: test
      password: test
      roles: ACTUATOR

  kafka:
    enabled: false
    bootstrap-servers: ""
    listener:
      auto-startup: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  main:
    allow-bean-definition-overriding: true #      - org.springframework.boot.autoconfigure.kafka.KafkaAnnotationDrivenConfiguration


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
    logfile:
      access: none
    loggers:
      access: none

logging:
  file:
    name: build/test.log

email:
  templates:
    dir: ${EMAIL_TEMPLATES_DIR:file:${user.dir}/email-templates}
    support-link: "#"
    caption: Cherkizon-Online
