spring:
  application:
    name: notification-service

  mail:
    host: smtp.yandex.ru
    port: 587
    username: ${EMAIL_USER:notifications@example.com}
    password: ${EMAIL_APP_PASSWORD:}
    protocol: smtp
    properties:
      mail.smtp:
        auth: true
        ssl.enable: false
        starttls.enable: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

  security:
    user:
      name: actuator-user
      password: ${ACTUATOR_PASSWORD:actuator-password}
      roles: ACTUATOR

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    listener:
      auto-startup: true
    consumer:
      group-id: email-notification-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 5000
            logger-level: basic
          comments-service:
            url: http://localhost:8081
          profile-service:
            url: http://localhost:8082
          ads-service:
            url: http://localhost:8083
server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info, logfile, loggers
  endpoint:
    health:
      show-details: always
    metrics:
      access: read_only
    info:
      access: read_only
    loggers:
      access: unrestricted
    logfile:
      access: read_only

email:
  templates:
    dir: ${EMAIL_TEMPLATES_DIR:file:${user.dir}/email-templates}
    support-link: "#"
    caption: Cherkizon-Online