name: Service Test CI

on:
  workflow_call:
    inputs:
      module:
        required: true
        type: string
      needs_db:
        default: false
        type: boolean
      db_name:
        required: false
        type: string
      db_password:
        required: false
        type: string

jobs:
  service-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Start PostgreSQL
        if: ${{ inputs.needs_db }}
        run: |
          docker run -d --name postgres \
            -e POSTGRES_DB=${{ inputs.db_name }} \
            -e POSTGRES_USER=dev \
            -e POSTGRES_PASSWORD=${{ inputs.db_password }} \
            -p 5432:5432 \
            postgres:17-alpine

          timeout 60 bash -c 'until docker exec postgres pg_isready -U dev; do sleep 2; done'

      - name: Run tests
        run: |
          cd backend/${{ inputs.module }}
          mvn clean test

      - name: Stop PostgreSQL
        if: ${{ inputs.needs_db }}
        run: |
          docker stop postgres
          docker rm postgres


      
          



