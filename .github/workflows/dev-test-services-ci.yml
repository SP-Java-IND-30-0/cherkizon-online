name: Test Services on PR to dev CI

on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/**'
      - '!backend/pom.xml'

jobs:
  validate-branch-name:
    runs-on: ubuntu-latest
    outputs:
      module: ${{ steps.extract-module.outputs.module }}
      is-valid-branch: ${{ steps.check-branch.outputs.is-valid }}
    steps:
      - name: Check branch format
        id: check-branch
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          if [[ "$BRANCH_NAME" =~ ^(feature|fix|chore|docs|test|refactor|hotfix)/([^/]+)/.* ]]; then
            echo "is-valid=true" >> $GITHUB_OUTPUT
          else
            echo "is-valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Extract module
        id: extract-module
        if: steps.check-branch.outputs.is-valid == 'true'
        run: |
          MODULE=$(echo "${{ github.head_ref || github.ref_name }}" | cut -d'/' -f2)
          echo "module=$MODULE" >> $GITHUB_OUTPUT

  test-module:
    needs: validate-branch-name
    if: needs.validate-branch-name.outputs.is-valid == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - module: comments-service
            db_name: comments_service_db
            secret: COMMENTS_SERVICE_DB_PASSWORD
          - module: ads-service
            db_name: ads_service_db
            secret: ADS_SERVICE_DB_PASSWORD
          - module: auth-service
            db_name: auth_service_db
            secret: AUTH_SERVICE_DB_PASSWORD
          - module: profile-service
            db_name: profile_service_db
            secret: PROFILE_SERVICE_DB_PASSWORD
    steps:
      - name: Run tests
        uses: ./.github/workflows/backend-services-ci.yml
        with:
          module: ${{ needs.validate-branch-name.outputs.module }}
          needs_db: ${{ contains(matrix.*.module, needs.validate-branch-name.outputs.module) }}
          db_name: ${{ matrix.db_name }}
          db_password: ${{ secrets[matrix.secret] }}
