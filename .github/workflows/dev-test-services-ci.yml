name: Test Services on PR to dev CI

on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/**'
      - '!backend/pom.xml'

jobs:
  validate-branch-name:
    runs-on: ubuntu-latest
    outputs:
      module: ${{ steps.extract-module.outputs.module }}
      is-valid-branch: ${{ steps.check-branch.outputs.is-valid }}
    steps:
      - name: Check branch format
        id: check-branch
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          if [[ "$BRANCH_NAME" =~ ^(feature|fix|chore|docs|test|refactor|hotfix)/([^/]+)/.* ]]; then
            echo "is-valid=true" >> $GITHUB_OUTPUT
          else
            echo "is-valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Extract module
        id: extract-module
        if: steps.check-branch.outputs.is-valid == 'true'
        run: |
          MODULE=$(echo "${{ github.head_ref || github.ref_name }}" | cut -d'/' -f2)
          echo "module=$MODULE" >> $GITHUB_OUTPUT

  test-module:
    needs: validate-branch-name
    if: needs.validate-branch-name.outputs.is-valid == 'true'
    uses: ./.github/workflows/backend-services-ci.yml
    with:
      module: ${{ needs.validate-branch-name.outputs.module }}
      needs_db: ${{ contains('comments-service,ads-service,auth-service,profile-service', needs.validate-branch-name.outputs.module) }}
      db_name: ${{ 
        needs.validate-branch-name.outputs.module == 'comments-service' && 'comments_service_db' ||
        needs.validate-branch-name.outputs.module == 'ads-service' && 'ads_service_db' ||
        needs.validate-branch-name.outputs.module == 'auth-service' && 'auth_service_db' ||
        needs.validate-branch-name.outputs.module == 'profile-service' && 'profile_service_db' 
        }}
      db_password: ${{ 
        needs.validate-branch-name.outputs.module == 'comments-service' && secrets.COMMENTS_SERVICE_DB_PASSWORD ||
        needs.validate-branch-name.outputs.module == 'ads-service' && secrets.ADS_SERVICE_DB_PASSWORD ||
        needs.validate-branch-name.outputs.module == 'auth-service' && secrets.AUTH_SERVICE_DB_PASSWORD ||
        needs.validate-branch-name.outputs.module == 'profile-service' && secrets.PROFILE_SERVICE_DB_PASSWORD 
        }}
