name: Build and Test Comments Service

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'backend/comments-service/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Load environment variables from Example.env
        run: |
          if [ -f backend/comments-service/Example.env ]; then
            export $(cat backend/comments-service/Example.env | xargs)
            echo "Environment variables loaded from Example.env"
          fi

      - name: Set up COMMENTS_DB_PASSWORD from secrets
        run: echo "COMMENTS_DB_PASSWORD=${{ secrets.COMMENTS_DB_PASSWORD }}" >> $GITHUB_ENV

      - name: Build and Test comments-service
        run: |
          cd backend/comments-service
          mvn clean test -DskipTests -DCOMMENTS_DB_PASSWORD=$COMMENTS_DB_PASSWORD